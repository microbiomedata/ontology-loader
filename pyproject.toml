[tool.poetry]
version = "0.0.0"
description = "ontology_loader"
authors = ["Sierra Moxon <smoxon@lbl.gov>"]
license = "MIT"
readme = "README.md"
name = "ontology-loader"
packages = [{ include = "ontology_loader", from = "src" }]

[tool.poetry.dependencies]
# oaklib 0.7.4 declares Python <3.15, so this must be bounded to match instead of an open-ended
# range -- poetry's own solver rejects it. The floor is 3.12 because eutils 0.6.1 (below) requires it,
# and nmdc-runtime, the main consumer, already requires 3.12.
python = ">=3.12,<3.15"
# Floors below are the lowest versions the test suite passes with on Python 3.12-3.14
# (`uv lock --resolution lowest-direct`). linkml-store 0.2.x requires pystow <0.6, which oaklib 0.7.4
# rules out, so 0.3.0 is the real floor, and it requires pymongo >=4.11.
pymongo = ">=4.11,<5.0.0"
# OntologyClass gained `is_root` and `is_obsolete` in 11.5.0. 11.5.x-11.6.x pin linkml-runtime 1.8.3,
# which fails to import on Python 3.13+, so 11.7.0 is the first release that works across the range.
nmdc-schema = ">=11.7.0"
oaklib = "^0.7.4"
click = "^8.1.7"
linkml-store = ">=0.3.0"
pystow = "^0.7.28"
# Imported directly in src/, so declared rather than relied on through linkml-store and oaklib.
linkml-runtime = ">=1.9.1"
sqlalchemy = ">=1.4.32"

# `eutils` (transitive via `oaklib`) imports `pkg_resources` at module load through 0.6.0, which
# setuptools 80 removed (#42). 0.6.1 dropped that import, so require it instead of capping setuptools.
eutils = ">=0.6.1"
# 4.66.3 fixes CVE-2024-34062.
tqdm = ">=4.66.3,<5.0.0"

[tool.poetry.group.dev.dependencies]
# pytest/tox/pytest-cov are only imported from tests/ and tox.ini, never from src/, so this direct
# declaration doesn't belong in [tool.poetry.dependencies] -- that forces it onto every downstream
# install. Consolidated here from what used to be two separate (and looser) declarations in both
# groups. >=9.0.3 is the actual CVE-2025-71176 fix (versions below it, including all of 8.x, are
# vulnerable); <10.0.0 leaves room for the current 9.x line without guessing at a future major
# version's compatibility. Note: pytest still reaches downstream installs transitively (the main
# dependency prefixcommons requires pytest-logging, which requires pytest>=2.8.1) -- this pin
# controls only the direct declaration, not that path, though it's no longer a version conflict
# for anyone resolving pytest>=9.0.3 either way.
pytest = ">=9.0.3,<10.0.0"
tox = "^4.24.1"
pytest-cov = "^7.1.0"
pre-commit = {version = ">=3.3.3"}

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = {version = ">=6.1.3"}
sphinx-rtd-theme = {version = ">=1.0.0"}
sphinx-autodoc-typehints = {version = ">=1.2.0"}
sphinx-click = {version = ">=4.3.0"}
myst-parser = {version = ">=0.18.1"}

[tool.poetry.scripts]
ontology_loader = "ontology_loader.cli:cli"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"


[tool.ruff]
line-length = 120
# Match the project's minimum supported Python (declared above as `python = ">=3.12,<3.15"`).
# A higher target-version would let Ruff allow/format 3.13+-only syntax that won't run on 3.12.
target-version = "py312"

[tool.ruff.lint]
extend-ignore = [
    "D203",  # `incorrect-blank-line-before-class` (conflicts with the formatter; duplicate of PR #31)
    "D211",  # `no-blank-line-before-class`
    "D212",  # `multi-line-summary-first-line`
    ]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Select or ignore from https://beta.ruff.rs/docs/rules/
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "S",  # flake8-bandit
    "W",  # Warning
]

unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.codespell]
skip = "*.po,*.ts,.git,pyproject.toml"
count = ""
quiet-level = 3
# ignore-words-list = ""

[tool.pytest.ini_options]
# pytest-cov plugin: auto-enable coverage on every `pytest` invocation
# (including `make test` and tox). Threshold + reporting are configured
# under `[tool.coverage.*]` below.
addopts = "--cov=ontology_loader --cov-report=term-missing"

[tool.coverage.run]
source = ["ontology_loader"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
# Starting threshold picked from the measured baseline on this branch
# (80% of `src/ontology_loader/` statements). The intent is to lock in
# today's coverage as a floor; ratchet up as new tests land.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
